[project]
name = "retail-price-optimization"
version = "0.1.0"
description = "Retail price optimization: Bayesian elasticity, baseline, NLopt pricing and promo budget allocation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "statsmodels>=0.14",
    "pymc>=5.16",
    "arviz>=0.18",
    "nlopt>=2.7.1",
    "pulp>=4.3",
    "highspy>=1.16",
    "xgboost>=3.0",
    "holidays>=0.50",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "pre-commit>=4.7.0",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
