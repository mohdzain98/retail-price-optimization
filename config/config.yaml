# Single source of truth for every tunable in the pipeline.
# Loaded and validated by src/rpo/config.py.

data:
  raw_file: "dunnhumby - Breakfast at the Frat.xlsx"  # verify exact name on download
  sheets:  # verify exact sheet names on download (Phase 1)
    transactions: "dh Transaction Data"
    products: "dh Products Lookup"
    stores: "dh Store Lookup"
  header_row: null  # 0-based; null = auto-detect (release may have a title row)
  grain: product_week  # product_week | store_product_week
  # raw column name -> canonical name; verify against the downloaded file
  columns:
    transactions:
      WEEK_END_DATE: week
      STORE_NUM: store
      UPC: upc
      UNITS: units
      VISITS: visits
      HHS: hhs
      SPEND: spend
      PRICE: price
      BASE_PRICE: base_price
      FEATURE: feature
      DISPLAY: display
      TPR_ONLY: tpr
    products:
      UPC: upc
      DESCRIPTION: description
      MANUFACTURER: manufacturer
      CATEGORY: category
      SUB_CATEGORY: sub_category
      PRODUCT_SIZE: product_size
    stores:
      STORE_ID: store
      STORE_NAME: store_name
      ADDRESS_STATE_PROV_CODE: state
      SEG_VALUE_NAME: segment

filters:
  min_weeks: 52
  min_price_variation: 0.05  # min (max/min - 1) of weekly price per product

split:
  holdout_weeks: 13

features:
  fourier_order: 3
  holiday_country: US

trend:
  # > 52 so the trend stays smoother than yearly seasonality (Fourier terms own that)
  lowess_window_weeks: 78

elasticity:
  bounds: [-5.0, -0.3]
  bayes:
    draws: 1000
    tune: 1000
    chains: 4
    target_accept: 0.9
    seed: 42
    hdi_prob: 0.94

cost:
  # cost = (1 - margin) * base_price; no cost column in the dataset
  default_margin: 0.30
  margin_by_category:
    BAG SNACKS: 0.35
    COLD CEREAL: 0.30
    FROZEN PIZZA: 0.28
    ORAL HYGIENE PRODUCTS: 0.40

optimization:
  objective: profit  # profit | revenue | weighted
  profit_weight: 1.0  # used when objective = weighted
  demand_form: constant_elasticity  # constant_elasticity | linear
  price_bounds: [0.8, 1.2]  # multipliers of current price
  volume_floor: 0.95  # portfolio volume >= floor * current volume
  max_avg_price_increase: 0.05
  ladder_min_gap: 0.10  # premium >= (1 + gap) * value tier
  algorithms: [LD_SLSQP, LN_COBYLA, GN_ISRES]
  maxeval: 2000
  xtol_rel: 1.0e-8
  price_endings: [0.49, 0.99]

forecast:
  horizon_weeks: 13

promo:
  budget: 50000.0
  tactics: [tpr, feature, display]
  fixed_cost: {tpr: 0.0, feature: 500.0, display: 300.0}  # assumed per SKU-week
  max_promos_per_sku: 4
  min_gap_weeks: 3
