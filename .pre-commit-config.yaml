# Checks that run on every commit. Same tools as `make check` / CI.
# One-time setup:  make hooks      Run everywhere:  pre-commit run --all-files
# archive notebook is still stripped; ruff skips archive/ via pyproject (--force-exclude)
exclude: ^(data/|archive/.*\.csv$)

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: linter and formatter (the project's formatter is `ruff format`)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        files: ^(src|tests|scripts|app)/

  # Strip notebook outputs so diffs stay readable and no data leaks into git
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
